
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Affiliate Reseller Portal</title>
  
  <!-- Google Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f4f6f9;
      color: #1e293b;
      padding-bottom: 70px;
    }

    /* TOP HEADER */
    .top-header {
      background: #ffffff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 90;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    .logo-title {
      font-size: 16px;
      font-weight: 700;
      color: #2563eb;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-my-orders-toggle {
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* MAIN CONTAINER */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 12px;
    }

    /* MAIN SEARCH & CATEGORIES BAR */
    .search-section {
      background: #ffffff;
      border-radius: 14px;
      padding: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      margin-bottom: 12px;
    }

    .search-box {
      position: relative;
      margin-bottom: 10px;
    }

    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 13px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-size: 13px;
      outline: none;
      background: #f8fafc;
    }

    /* HORIZONTAL CATEGORY SCROLL BUTTONS */
    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 7px 14px;
      border-radius: 25px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .cat-btn.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    /* PRODUCT CARDS LIST */
    .products-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product-card {
      background: #ffffff;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    /* HORIZONTAL SCROLLABLE IMAGES FOR MOBILE */
    .image-gallery {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .image-gallery::-webkit-scrollbar {
      display: none;
    }

    .image-gallery img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #f1f5f9;
      flex-shrink: 0;
    }

    .prod-title {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .prod-desc {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .price-tag-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 12px;
    }

    .price-amount {
      font-weight: 700;
      color: #16a34a;
    }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    .btn-download-photos {
      flex: 1;
      background: #f1f5f9;
      color: #1e293b;
      border: 1px solid #cbd5e1;
      padding: 9px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .btn-sell-now {
      flex: 1.5;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    /* ORDER DRAWER (MY ORDERS) */
    .orders-drawer {
      position: fixed;
      top: 0; right: -100%;
      width: 100%;
      max-width: 380px;
      height: 100%;
      background: #ffffff;
      box-shadow: -4px 0 15px rgba(0,0,0,0.1);
      z-index: 150;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .orders-drawer.open {
      right: 0;
    }

    .drawer-header {
      padding: 14px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
    }

    .drawer-header h3 {
      font-size: 14px;
      font-weight: 700;
    }

    .close-drawer-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #64748b;
    }

    .drawer-body {
      padding: 12px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .order-card {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px;
      background: #f8fafc;
      font-size: 11px;
    }

    .order-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      font-weight: 700;
    }

    .status-badge {
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 9px;
      font-weight: 700;
    }

    .status-pending { background: #fef3c7; color: #d97706; }
    .status-done { background: #d1fae5; color: #059669; }

    /* SELL MODAL POPUP */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 200;
    }

    .modal-sheet {
      background: #ffffff;
      width: 100%;
      max-width: 500px;
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
      padding: 16px;
      max-height: 85vh;
      overflow-y: auto;
      animation: slideUp 0.2s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .modal-sheet-header h3 {
      font-size: 15px;
      font-weight: 700;
    }

    .calc-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .calc-row {
      display: flex;
      justify-content: space-between;
    }

    .calc-row.total {
      border-top: 1px solid #cbd5e1;
      padding-top: 6px;
      margin-top: 2px;
      font-size: 13px;
      font-weight: 700;
      color: #2563eb;
    }

    .form-field {
      margin-bottom: 10px;
    }

    .form-field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #334155;
    }

    .form-field input, .form-field textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
    }

    .btn-submit-order {
      width: 100%;
      background: #16a34a;
      color: #ffffff;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header class="top-header">
    <div class="logo-title">
      <i class="fa-solid fa-shop"></i> Reseller Store
    </div>
    <button class="btn-my-orders-toggle" onclick="toggleOrdersDrawer()">
      <i class="fa-solid fa-box"></i> My Orders
    </button>
  </header>

  <!-- MAIN CONTAINER -->
  <div class="container">

    <!-- SEARCH & CATEGORY BAR -->
    <div class="search-section">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search product name..." onkeyup="filterProducts()" />
      </div>
      
      <!-- CATEGORY SCROLL BUTTONS -->
      <div class="category-scroll">
        <button class="cat-btn active" onclick="selectCat('all', this)"><i class="fa-solid fa-border-all"></i> All</button>
        <button class="cat-btn" onclick="selectCat('jewelry', this)"><i class="fa-solid fa-gem"></i> Jewelry</button>
        <button class="cat-btn" onclick="selectCat('clothes', this)"><i class="fa-solid fa-shirt"></i> Clothes</button>
        <button class="cat-btn" onclick="selectCat('mobiles', this)"><i class="fa-solid fa-mobile-screen-button"></i> Mobiles</button>
        <button class="cat-btn" onclick="selectCat('tools', this)"><i class="fa-solid fa-wrench"></i> Tools</button>
      </div>
    </div>

    <!-- PRODUCTS GRID/LIST -->
    <div class="products-list" id="productsList">
      <div style="text-align:center; padding: 20px; color: #64748b; font-size: 12px;">
        Products Load Ho Rahe Hain...
      </div>
    </div>

  </div>

  <!-- MY ORDERS DRAWER -->
  <div class="orders-drawer" id="ordersDrawer">
    <div class="drawer-header">
      <h3><i class="fa-solid fa-truck-fast"></i> My Client Orders</h3>
      <button class="close-drawer-btn" onclick="toggleOrdersDrawer()">✕</button>
    </div>
    <div class="drawer-body" id="drawerOrdersList">
      <div style="text-align: center; color: #64748b; font-size: 12px; padding-top: 20px;">
        Abhi koi order submit nahi hua.
      </div>
    </div>
  </div>

  <!-- SELL PRODUCT MODAL -->
  <div class="modal-backdrop" id="sellModal">
    <div class="modal-sheet">
      <div class="modal-sheet-header">
        <h3>Client Order Form</h3>
        <button class="close-drawer-btn" onclick="closeSellModal()">✕</button>
      </div>

      <form id="orderForm" onsubmit="submitOrder(event)">
        <!-- LIVE PRICE CALCULATOR -->
        <div class="calc-box">
          <div class="calc-row">
            <span>Wholesale Price:</span>
            <span>Rs. <span id="calcBase">0</span></span>
          </div>
          <div class="calc-row">
            <span>Your Commission (Profit):</span>
            <span>+ Rs. <span id="calcProfit">0</span></span>
          </div>
          <div class="calc-row total">
            <span>Client Final Total Price:</span>
            <span>Rs. <span id="calcTotal">0</span></span>
          </div>
        </div>

        <div class="form-field">
          <label>Apna Commission Likhein (Rs.):</label>
          <input type="number" id="inputProfit" value="100" min="0" required oninput="reCalculate()" />
        </div>

        <div class="form-field">
          <label>Quantity (Tadad):</label>
          <input type="number" id="inputQty" value="1" min="1" required oninput="reCalculate()" />
        </div>

        <div class="form-field">
          <label>Client Ka Naam:</label>
          <input type="text" id="clientName" placeholder="Customer Full Name" required />
        </div>

        <div class="form-field">
          <label>Client WhatsApp / Mobile Number:</label>
          <input type="tel" id="clientPhone" placeholder="03XXXXXXXXX" required />
        </div>

        <div class="form-field">
          <label>Client Ka Poora Address:</label>
          <textarea id="clientAddress" rows="2" placeholder="House #, Street, City Name" required></textarea>
        </div>

        <div class="form-field">
          <label>Apna Easypaisa/Jazzcash/Bank Account (Paise lene ke liye):</label>
          <input type="text" id="userPayoutAccount" placeholder="Account Title & Number" required />
        </div>

        <button type="submit" class="btn-submit-order">Order Confirm Karke Admin Ko Bhejen</button>
      </form>
    </div>
  </div>

  <!-- FIREBASE SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAsnATksiqZzMHOPO64i_bKqLJW6yjq9lw",
      authDomain: "newweb-d50af.firebaseapp.com",
      databaseURL: "https://newweb-d50af-default-rtdb.firebaseio.com",
      projectId: "newweb-d50af",
      storageBucket: "newweb-d50af.firebasestorage.app",
      messagingSenderId: "358603295768",
      appId: "1:358603295768:web:82a9666514a7cb468c476d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const rawSession = localStorage.getItem('sew_session');
    const userData = JSON.parse(rawSession || '{"username":"reseller_user"}');

    let allProducts = [];
    let activeCategory = 'all';
    let selectedProduct = null;

    // REALTIME PRODUCTS FETCH FROM FIREBASE
    onValue(ref(db, 'products'), (snapshot) => {
      allProducts = [];
      if (snapshot.exists()) {
        const data = snapshot.val();
        Object.keys(data).forEach(k => {
          allProducts.push({ id: k, ...data[k] });
        });
      } else {
        // Fallback Sample Data if Firebase empty
        allProducts = [
          {
            id: "p1",
            name: "Gold Plated Jewelry Set",
            category: "jewelry",
            price: 1200,
            details: "High quality bridal necklace & earrings set.",
            images: [
              "https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=500",
              "https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?w=500"
            ]
          },
          {
            id: "p2",
            name: "3-Piece Printed Lawn Suit",
            category: "clothes",
            price: 1800,
            details: "Soft lawn fabric with chiffon dupatta.",
            images: [
              "https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=500",
              "https://images.unsplash.com/photo-1583391733956-6c78276477e2?w=500"
            ]
          }
        ];
      }
      renderProducts();
    });

    // RENDER PRODUCTS
    function renderProducts() {
      const list = document.getElementById('productsList');
      list.innerHTML = "";

      const query = document.getElementById('searchInput').value.toLowerCase();

      const filtered = allProducts.filter(p => {
        const c = (p.category || '').toLowerCase();
        const matchCat = activeCategory === 'all' || c === activeCategory;
        const matchSearch = !query || p.name.toLowerCase().includes(query);
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        list.innerHTML = `<div style="text-align:center; padding: 20px; color: #64748b; font-size: 12px;">Is Category Me Koi Product Nahi Mila.</div>`;
        return;
      }

      filtered.forEach(p => {
        const imgs = p.images || [p.image || 'https://via.placeholder.com/300'];
        let galleryHTML = '';
        imgs.forEach(src => {
          galleryHTML += `<img src="${src}" alt="product" />`;
        });

        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="image-gallery">${galleryHTML}</div>
          <div class="prod-title">${p.name}</div>
          <div class="prod-desc">${p.details || ''}</div>
          <div class="price-tag-row">
            <span>Wholesale Price:</span>
            <span class="price-amount">Rs. ${p.price}</span>
          </div>
          <div class="card-actions">
            <button class="btn-download-photos" onclick="downloadAllImgs('${p.id}')">
              <i class="fa-solid fa-download"></i> Photos Download
            </button>
            <button class="btn-sell-now" onclick="openSellModal('${p.id}')">
              <i class="fa-solid fa-cart-shopping"></i> Sell & Earn
            </button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    // CATEGORY FILTER
    window.selectCat = function(catName, btn) {
      activeCategory = catName;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      renderProducts();
    };

    window.filterProducts = function() {
      renderProducts();
    };

    // DOWNLOAD PICTURES (FIXED DIRECT DOWNLOAD BLOB LOGIC)
    window.downloadAllImgs = async function(productId) {
      const item = allProducts.find(p => p.id === productId);
      if(!item) return;
      const imgs = item.images || [item.image];

      alert("Downloading photos... Please wait 2-3 seconds.");

      for(let i = 0; i < imgs.length; i++) {
        const url = imgs[i];
        try {
          const resp = await fetch(url);
          const blob = await resp.blob();
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = `${item.name.replace(/\s+/g, '_')}_${i + 1}.jpg`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(blobUrl);
        } catch (e) {
          window.open(url, '_blank');
        }
      }
    };

    // MODAL FUNCTIONS
    window.openSellModal = function(productId) {
      selectedProduct = allProducts.find(p => p.id === productId);
      if(!selectedProduct) return;

      document.getElementById('calcBase').innerText = selectedProduct.price;
      document.getElementById('inputProfit').value = 100;
      document.getElementById('inputQty').value = 1;
      
      const savedAcc = localStorage.getItem('payout_acc_no') || '';
      if(savedAcc) document.getElementById('userPayoutAccount').value = savedAcc;

      reCalculate();
      document.getElementById('sellModal').style.display = 'flex';
    };

    window.closeSellModal = function() {
      document.getElementById('sellModal').style.display = 'none';
    };

    window.reCalculate = function() {
      if(!selectedProduct) return;
      const base = parseInt(selectedProduct.price) || 0;
      const profit = parseInt(document.getElementById('inputProfit').value) || 0;
      const qty = parseInt(document.getElementById('inputQty').value) || 1;

      const totalProfit = profit * qty;
      const grandTotal = (base + profit) * qty;

      document.getElementById('calcProfit').innerText = totalProfit;
      document.getElementById('calcTotal').innerText = grandTotal;
    };

    // SUBMIT ORDER TO FIREBASE
    window.submitOrder = function(e) {
      e.preventDefault();

      const payoutAcc = document.getElementById('userPayoutAccount').value;
      localStorage.setItem('payout_acc_no', payoutAcc);

      const base = parseInt(selectedProduct.price) || 0;
      const profit = parseInt(document.getElementById('inputProfit').value) || 0;
      const qty = parseInt(document.getElementById('inputQty').value) || 1;

      const orderPayload = {
        resellerUsername: userData.username,
        payoutAccount: payoutAcc,
        productName: selectedProduct.name,
        basePrice: base,
        profitPerPiece: profit,
        totalProfit: profit * qty,
        clientTotalPrice: (base + profit) * qty,
        quantity: qty,
        clientName: document.getElementById('clientName').value,
        clientPhone: document.getElementById('clientPhone').value,
        clientAddress: document.getElementById('clientAddress').value,
        status: "pending", // Admin "done" karega
        timestamp: Date.now()
      };

      push(ref(db, 'affiliate_orders'), orderPayload)
        .then(() => {
          alert("Order Admin Ko Bhej Diya Gaya Hai!");
          closeSellModal();
          document.getElementById('orderForm').reset();
          toggleOrdersDrawer(true);
        })
        .catch(err => alert("Error: " + err.message));
    };

    // MY ORDERS DRAWER TOGGLE
    window.toggleOrdersDrawer = function(forceOpen = false) {
      const drawer = document.getElementById('ordersDrawer');
      if(forceOpen) {
        drawer.classList.add('open');
      } else {
        drawer.classList.toggle('open');
      }
    };

    // REALTIME MY ORDERS TRACKING LISTENER
    onValue(ref(db, 'affiliate_orders'), (snapshot) => {
      const container = document.getElementById('drawerOrdersList');
      container.innerHTML = "";

      if(snapshot.exists()) {
        const data = snapshot.val();
        let myOrders = [];

        Object.keys(data).forEach(k => {
          if(data[k].resellerUsername === userData.username) {
            myOrders.push({ id: k, ...data[k] });
          }
        });

        if(myOrders.length === 0) {
          container.innerHTML = `<div style="text-align: center; color: #64748b; font-size: 12px; padding-top: 20px;">Abhi koi order submit nahi hua.</div>`;
          return;
        }

        myOrders.reverse().forEach(o => {
          const isDone = o.status === 'done' || o.status === 'completed';
          const statusClass = isDone ? 'status-done' : 'status-pending';
          const statusText = isDone ? 'DONE (Paid)' : 'PENDING';

          const card = document.createElement('div');
          card.className = 'order-card';
          card.innerHTML = `
            <div class="order-card-header">
              <span>${o.productName}</span>
              <span class="status-badge ${statusClass}">${statusText}</span>
            </div>
            <div>Client: <strong>${o.clientName}</strong> (${o.clientPhone})</div>
            <div style="display:flex; justify-content:space-between; margin-top:4px;">
              <span>Total Price: Rs. ${o.clientTotalPrice}</span>
              <span style="color:#16a34a; font-weight:700;">Profit: Rs. ${o.totalProfit}</span>
            </div>
          `;
          container.appendChild(card);
        });
      } else {
        container.innerHTML = `<div style="text-align: center; color: #64748b; font-size: 12px; padding-top: 20px;">Abhi koi order submit nahi hua.</div>`;
      }
    });
  </script>
</body>
</html>
