<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SEW - Watch Ads & Earn</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script src="https://quge5.com/88/tag.min.js" data-zone="273760" async data-cfasync="false"></script>

  <style>
    :root {
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --input-bg: #f1f5f9;
      --primary: #2563eb;
      --text-main: #0f172a;
      --border-color: #e2e8f0;
      --shadow-soft: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { min-height: 100vh; background-color: var(--bg-body); display: flex; justify-content: center; padding: 20px 16px; color: var(--text-main); }
    .container { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card-bg); border-radius: 20px; padding: 20px; box-shadow: var(--shadow-soft); }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .back-btn { background: var(--input-bg); border: none; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-main); text-decoration: none; }
    .balance-box { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); border-radius: 16px; padding: 16px; color: #ffffff; text-align: center; }
    .balance-amount { font-size: 28px; font-weight: 800; }
    .ads-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    
    .ad-btn {
      background: var(--input-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-weight: 700;
      position: relative;
    }

    .ad-btn.loading {
      pointer-events: none;
      opacity: 0.8;
      background: #e2e8f0;
    }

    .ad-btn.locked { background: #fee2e2 !important; border-color: #fca5a5 !important; color: #991b1b !important; cursor: not-allowed; }

    /* Modal Styling */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px); z-index: 999; justify-content: center; align-items: center; padding: 16px; }
    .modal-card { background: #ffffff; border-radius: 20px; padding: 24px; width: 100%; max-width: 400px; text-align: center; display: flex; flex-direction: column; gap: 16px; }
    .timer-text { font-size: 20px; font-weight: 800; color: var(--warning); }
    .submit-btn { padding: 12px; border: none; border-radius: 12px; background: var(--success); color: #fff; font-weight: 700; cursor: pointer; }
    .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="card-header">
        <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div style="font-size: 18px; font-weight: 800;">Watch Ads & Earn</div>
        <div style="width: 40px;"></div>
      </div>
      <div class="balance-box">
        <label style="font-size: 12px; opacity: 0.85;">Current Balance</label>
        <div class="balance-amount" id="userBalance">Rs. 0.00</div>
      </div>
    </div>

    <div class="card">
      <div style="font-size: 16px; font-weight: 800; margin-bottom: 12px;"><i class="fa-solid fa-bolt" style="color: var(--primary);"></i> Daily Available Ads</div>
      <div class="ads-grid" id="adsContainer"></div>
    </div>
  </div>

  <!-- Verification Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal-card">
      <h3 id="modalTitle" style="font-size: 16px; font-weight: 800;">Ad Task Verification</h3>
      <div class="timer-text" id="timerBox"><i class="fa-solid fa-hourglass-half"></i> Stay on Ad: <span id="timerSec">60</span>s</div>
      <div id="uploadBox" style="display: none; flex-direction: column; gap: 12px;">
        <p style="font-size: 12px; color: var(--danger); font-weight: 700;">⚠️ Attach Proof Screenshot (Required)</p>
        <input type="file" id="proofInput" accept="image/*" onchange="checkProofSelected()" />
        <button class="submit-btn" id="submitProofBtn" disabled onclick="confirmTaskCompletion()">Submit Proof Screenshot</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAsnATksiqZzMHOPO64i_bKqLJW6yjq9lw",
      authDomain: "newweb-d50af.firebaseapp.com",
      databaseURL: "https://newweb-d50af-default-rtdb.firebaseio.com",
      projectId: "newweb-d50af",
      storageBucket: "newweb-d50af.firebasestorage.app",
      messagingSenderId: "358603295768",
      appId: "1:358603295768:web:82a9666514a7cb468c476d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const sessionUser = JSON.parse(localStorage.getItem('sew_session') || '{}');
    if (!sessionUser.username) window.location.replace("index.html");

    const adLinks = [
      "https://omg10.com/4/11668537", "https://omg10.com/4/11668536", "https://omg10.com/4/11668535", "https://omg10.com/4/11668534", "https://omg10.com/4/11668533",
      "https://omg10.com/4/11668537", "https://omg10.com/4/11668536", "https://omg10.com/4/11668535", "https://omg10.com/4/11668534", "https://omg10.com/4/11668533",
      "https://omg10.com/4/11668537", "https://omg10.com/4/11668536", "https://omg10.com/4/11668535", "https://omg10.com/4/11668534", "https://omg10.com/4/11668533",
      "https://omg10.com/4/11668537", "https://omg10.com/4/11668536", "https://omg10.com/4/11668535", "https://omg10.com/4/11668534", "https://omg10.com/4/11668533",
      "https://omg10.com/4/11668537", "https://omg10.com/4/11668536", "https://omg10.com/4/11668535", "https://omg10.com/4/11668534", "https://omg10.com/4/11668533",
      "https://omg10.com/4/11668537", "https://omg10.com/4/11668536", "https://omg10.com/4/11668535", "https://omg10.com/4/11668534", "https://omg10.com/4/11668533"
    ];

    let userData = null, activeAdIndex = null, adTimerInterval = null, isAdActive = false, adStartTime = 0;
    const REQUIRED_STAY_TIME = 60;

    onValue(ref(db, 'users/' + sessionUser.username), (snap) => {
      if (snap.exists()) {
        userData = snap.val();
        document.getElementById('userBalance').innerText = "Rs. " + parseFloat(userData.balance || 0).toFixed(2);
        renderAdsSection();
      }
    });

    function renderAdsSection() {
      const container = document.getElementById('adsContainer');
      container.innerHTML = '';
      const now = Date.now(), lockDuration = 24 * 60 * 60 * 1000, locks = userData?.individualAdLocks || {};

      adLinks.forEach((url, i) => {
        const btn = document.createElement('button');
        const lockTime = locks[i] || 0;
        
        if (lockTime > 0 && (now - lockTime < lockDuration)) {
          btn.className = 'ad-btn locked';
          btn.disabled = true;
          btn.innerHTML = `<i class="fa-solid fa-lock"></i><span>Ad #${i + 1} Locked</span>`;
        } else {
          btn.className = 'ad-btn';
          btn.id = `adBtn_${i}`;
          btn.innerHTML = `<i class="fa-solid fa-rectangle-ad"></i> Open Ad #${i + 1} <span style="font-size:10px; color:var(--success);">(Rs. 5)</span>`;
          btn.onclick = () => handleAdClick(i, url);
        }
        container.appendChild(btn);
      });
    }

    window.handleAdClick = function(index, url) {
      const btn = document.getElementById(`adBtn_${index}`);
      btn.classList.add('loading');
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Opening Ad...`;

      setTimeout(() => {
        btn.classList.remove('loading');
        btn.innerHTML = `<i class="fa-solid fa-rectangle-ad"></i> Open Ad #${index + 1} <span style="font-size:10px; color:var(--success);">(Rs. 5)</span>`;
        
        activeAdIndex = index;
        isAdActive = true;
        adStartTime = Date.now();

        window.open(url, '_blank');
        document.getElementById('taskModal').style.display = 'flex';
        document.getElementById('timerBox').style.display = 'block';
        document.getElementById('uploadBox').style.display = 'none';

        if (adTimerInterval) clearInterval(adTimerInterval);
        adTimerInterval = setInterval(updateAdTimer, 1000);
      }, 1000);
    };

    function updateAdTimer() {
      if (!isAdActive) return;
      const elapsedSec = Math.floor((Date.now() - adStartTime) / 1000);
      const remainingSec = REQUIRED_STAY_TIME - elapsedSec;

      if (remainingSec <= 0) {
        clearInterval(adTimerInterval);
        isAdActive = false;
        document.getElementById('timerBox').style.display = 'none';
        document.getElementById('uploadBox').style.display = 'flex';
      } else {
        document.getElementById('timerSec').innerText = remainingSec;
      }
    }

    window.checkProofSelected = function() {
      document.getElementById('submitProofBtn').disabled = !document.getElementById('proofInput').files[0];
    };

    window.confirmTaskCompletion = async function() {
      const file = document.getElementById('proofInput').files[0];
      const btn = document.getElementById('submitProofBtn');
      btn.disabled = true;
      btn.innerText = "Uploading Proof...";

      const reader = new FileReader();
      reader.onload = async function(e) {
        const base64Img = e.target.result;
        const now = Date.now();

        await update(ref(db, `users/${sessionUser.username}`), {
          [`individualAdLocks/${activeAdIndex}`]: now,
          pendingApprovalsCount: (userData.pendingApprovalsCount || 0) + 1
        });

        await push(ref(db, 'admin_pending_tasks'), {
          username: sessionUser.username,
          adIndex: activeAdIndex + 1,
          reward: 5.00,
          proofImage: base64Img,
          timestamp: now,
          status: "pending"
        });

        alert("Screenshot submitted! Admin approve karega tab Rs. 5 milenge.");
        document.getElementById('taskModal').style.display = 'none';
      };
      reader.readAsDataURL(file);
    };
  </script>
</body>
</html>
