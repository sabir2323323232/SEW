
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SEW - Affiliate Dashboard</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-body: #f1f5f9;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow-x: hidden;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAVBAR */
    .navbar {
      background: #ffffff;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 1px 8px rgba(0, 0, 0, 0.03);
    }

    .logout-btn {
      background: #fef2f2;
      color: #ef4444;
      border: 1px solid #fee2e2;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 1px;
    }

    .profile-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--primary-soft);
      padding: 3px 6px;
      border-radius: 16px;
      cursor: pointer;
      border: 1px solid #dbeafe;
    }

    .avatar {
      width: 20px;
      height: 20px;
      background: var(--primary);
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 10px;
    }

    .user-name-short {
      font-size: 10px;
      font-weight: 700;
      color: var(--primary);
      max-width: 75px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CONTAINER */
    .container {
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
      padding: 6px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-x: hidden;
    }

    /* EARNING SECTION */
    .earning-section {
      background: #ffffff;
      border-radius: 12px;
      padding: 8px;
      border: 1px solid var(--border-color);
    }

    .balance-card {
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      border-radius: 8px;
      padding: 6px 10px;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .balance-info p {
      font-size: 9px;
      opacity: 0.85;
      font-weight: 700;
      text-transform: uppercase;
    }

    .balance-amount {
      font-size: 16px;
      font-weight: 800;
    }

    .balance-icon {
      font-size: 16px;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 8px;
      border-radius: 6px;
    }

    /* 5 BUTTONS GRID */
    .earning-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .earn-btn {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 2px;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-weight: 700;
      font-size: 8px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .earn-btn:active {
      background: #e2e8f0;
    }

    .earn-btn i {
      font-size: 12px;
      color: var(--primary);
    }

    /* BANNER */
    .market-banner {
      background: #0f172a;
      color: #ffffff;
      border-radius: 8px;
      padding: 5px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .market-banner-text h2 {
      font-size: 11px;
      font-weight: 800;
      color: #f59e0b;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .discount-badge {
      background: #ef4444;
      color: #ffffff;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 9px;
    }

    /* MARKET SECTION */
    .market-section {
      background: #ffffff;
      border-radius: 12px;
      padding: 8px;
      border: 1px solid var(--border-color);
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .search-box {
      position: relative;
      margin-bottom: 6px;
    }

    .search-box i {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 11px;
    }

    .search-box input {
      width: 100%;
      padding: 6px 8px 6px 26px;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 11px;
      outline: none;
    }

    /* PRODUCT SLIDER */
    .product-grid {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
      padding-bottom: 4px;
      margin-bottom: 4px;
      scrollbar-width: none;
      min-height: 130px;
    }

    .product-grid::-webkit-scrollbar {
      display: none;
    }

    .product-card {
      flex: 0 0 160px;
      scroll-snap-align: start;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .product-img {
      width: 100%;
      height: 70px;
      object-fit: cover;
      border-radius: 5px;
      background: #f1f5f9;
    }

    .product-title {
      font-size: 10px;
      font-weight: 700;
      margin: 4px 0 1px 0;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-desc {
      font-size: 8px;
      color: var(--text-muted);
      margin-bottom: 4px;
      height: 12px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .product-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .product-price {
      font-size: 10px;
      font-weight: 800;
      color: var(--accent-green);
    }

    .affiliate-btn {
      background: var(--primary);
      color: #ffffff;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 9px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      text-decoration: none;
    }

    .product-arrows {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 0 2px;
    }

    .arrow-btn {
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid #dbeafe;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 11px;
    }

    .arrow-text {
      font-size: 9px;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
    }

    /* CATEGORIES WRAPPER */
    .categories-wrapper {
      margin-top: auto;
      padding-top: 6px;
    }

    .category-section-title {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .category-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .cat-btn {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 6px;
      color: var(--text-main);
      font-weight: 700;
      font-size: 9px;
      display: flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }

    .cat-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .cat-btn.active i {
      color: #ffffff;
    }

    .cat-btn i {
      color: var(--primary);
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 12px;
    }

    .modal-box {
      background: #ffffff;
      width: 100%;
      max-width: 340px;
      border-radius: 14px;
      padding: 16px;
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 10px; right: 10px;
      background: #f1f5f9;
      border: none;
      width: 24px; height: 24px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: 800;
      font-size: 12px;
    }

    .modal-avatar {
      width: 40px; height: 40px;
      background: var(--primary);
      color: #ffffff;
      font-size: 16px; font-weight: 800;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 6px auto;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 10px;
    }
  </style>
</head>
<body>

  <!-- TOP NAVBAR -->
  <header class="navbar">
    <button class="logout-btn" onclick="handleLogout()">
      <i class="fa-solid fa-right-from-bracket"></i> Logout
    </button>

    <div class="brand-title">SEW</div>

    <div class="profile-pill" onclick="openProfileModal()">
      <div class="avatar" id="navAvatar">U</div>
      <span class="user-name-short" id="navUserName">User</span>
    </div>
  </header>

  <div class="container">

    <!-- BALANCE & ACTIONS SECTION -->
    <section class="earning-section">
      <div class="balance-card">
        <div class="balance-info">
          <p>Total Balance</p>
          <div class="balance-amount" id="userBalance">Rs. 0.00</div>
        </div>
        <div class="balance-icon">
          <i class="fa-solid fa-wallet"></i>
        </div>
      </div>

      <div class="earning-grid">
        <div class="earn-btn" onclick="navigateTo('free-ads.html')">
          <i class="fa-solid fa-rectangle-ad"></i>
          <span>Free Ads</span>
        </div>

        <div class="earn-btn" onclick="navigateTo('referral.html')">
          <i class="fa-solid fa-users"></i>
          <span>Referral</span>
        </div>

        <div class="earn-btn" onclick="navigateTo('gmail-selling.html')">
          <i class="fa-solid fa-envelope"></i>
          <span>Gmail</span>
        </div>

        <div class="earn-btn" onclick="navigateTo('withdraw.html')">
          <i class="fa-solid fa-money-bill-transfer"></i>
          <span>Withdraw</span>
        </div>

        <div class="earn-btn" onclick="navigateTo('free-jobs.html')">
          <i class="fa-solid fa-briefcase"></i>
          <span>Jobs</span>
        </div>
      </div>
    </section>

    <!-- BANNER -->
    <div class="market-banner">
      <div class="market-banner-text">
        <h2><i class="fa-solid fa-bolt"></i> AFFILIATE MARKET OFFERS</h2>
      </div>
      <div class="discount-badge">HOT DEALS</div>
    </div>

    <!-- AFFILIATE PRODUCTS SECTION -->
    <section class="market-section">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search affiliate deals..." onkeyup="filterProducts()" />
      </div>

      <!-- Horizontal Product Slider -->
      <div class="product-grid" id="productGrid">
        <!-- Loaded Realtime from Firebase -->
      </div>

      <!-- SCROLL ARROWS -->
      <div class="product-arrows">
        <button type="button" class="arrow-btn" onclick="scrollProducts(-160)">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <span class="arrow-text"><i class="fa-solid fa-arrows-left-right"></i> Slide Products</span>
        <button type="button" class="arrow-btn" onclick="scrollProducts(160)">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <!-- CATEGORIES -->
      <div class="categories-wrapper">
        <div class="category-section-title">Categories</div>
        <div class="category-grid">
          <div class="cat-btn active" onclick="filterByCategory('all', this)"><i class="fa-solid fa-border-all"></i> All</div>
          <div class="cat-btn" onclick="filterByCategory('clothes', this)"><i class="fa-solid fa-shirt"></i> Clothes</div>
          <div class="cat-btn" onclick="filterByCategory('tools', this)"><i class="fa-solid fa-screwdriver-wrench"></i> Tools</div>
          <div class="cat-btn" onclick="filterByCategory('mobiles', this)"><i class="fa-solid fa-mobile-screen-button"></i> Mobiles</div>
          <div class="cat-btn" onclick="filterByCategory('motors', this)"><i class="fa-solid fa-motorcycle"></i> Motors</div>
          <div class="cat-btn" onclick="filterByCategory('jewelry', this)"><i class="fa-solid fa-gem"></i> Jewelry</div>
        </div>
      </div>
    </section>

  </div>

  <!-- PROFILE MODAL -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-box">
      <button class="close-modal" onclick="closeProfileModal()">✕</button>
      
      <div style="text-align: center; margin-bottom: 10px;">
        <div class="modal-avatar" id="modalAvatar">U</div>
        <h4 id="modalFullName" style="font-size: 13px; font-weight: 800;">User Name</h4>
        <p id="modalUsername" style="font-size: 10px; color: var(--text-muted);">@username</p>
      </div>

      <div class="detail-item"><span style="color:var(--text-muted)">Mobile:</span> <strong id="modalMobile">-</strong></div>
      <div class="detail-item"><span style="color:var(--text-muted)">Email:</span> <strong id="modalEmail">-</strong></div>
      <div class="detail-item"><span style="color:var(--text-muted)">City:</span> <strong id="modalCity">-</strong></div>
      <div class="detail-item"><span style="color:var(--text-muted)">Country:</span> <strong id="modalCountry">-</strong></div>
    </div>
  </div>

  <!-- Global Navigation Script -->
  <script>
    function navigateTo(pageUrl) {
      if (!pageUrl) return;
      window.location.href = pageUrl;
    }

    function scrollProducts(amount) {
      const grid = document.getElementById('productGrid');
      if (grid) grid.scrollBy({ left: amount, behavior: 'smooth' });
    }

    function handleLogout() {
      localStorage.removeItem('sew_session');
      window.location.replace("index.html");
    }

    function openProfileModal() {
      document.getElementById('profileModal').style.display = 'flex';
    }

    function closeProfileModal() {
      document.getElementById('profileModal').style.display = 'none';
    }

    // Direct Affiliate Link Redirect
    function openAffiliateLink(url) {
      if (url && url !== '#') {
        window.open(url, '_blank');
      } else {
        alert("Affiliate link not configured.");
      }
    }
  </script>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAsnATksiqZzMHOPO64i_bKqLJW6yjq9lw",
      authDomain: "newweb-d50af.firebaseapp.com",
      databaseURL: "https://newweb-d50af-default-rtdb.firebaseio.com",
      projectId: "newweb-d50af",
      storageBucket: "newweb-d50af.firebasestorage.app",
      messagingSenderId: "358603295768",
      appId: "1:358603295768:web:82a9666514a7cb468c476d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Session Check
    const rawSession = localStorage.getItem('sew_session');
    if (!rawSession) {
      window.location.replace("index.html");
    }

    const userData = JSON.parse(rawSession || '{}');
    let selectedCategory = 'all';

    function renderUserUI(data) {
      if(!data) return;
      const displayTitle = data.fullName || data.username || "User";
      document.getElementById('navUserName').innerText = displayTitle;
      const initial = displayTitle.charAt(0).toUpperCase();
      document.getElementById('navAvatar').innerText = initial;
      document.getElementById('userBalance').innerText = "Rs. " + (data.balance || "0.00");

      document.getElementById('modalAvatar').innerText = initial;
      document.getElementById('modalFullName').innerText = data.fullName || "User";
      document.getElementById('modalUsername').innerText = "@" + (data.username || "");
      document.getElementById('modalMobile').innerText = data.mobile || "N/A";
      document.getElementById('modalEmail').innerText = data.email || "N/A";
      document.getElementById('modalCity').innerText = data.city || "N/A";
      document.getElementById('modalCountry').innerText = data.country || "N/A";
    }

    renderUserUI(userData);

    // REALTIME USER BALANCE SYNC
    if (userData.username) {
      onValue(ref(db, 'users/' + userData.username), (snapshot) => {
        if (snapshot.exists()) {
          const freshData = snapshot.val();
          renderUserUI(freshData);
          localStorage.setItem('sew_session', JSON.stringify(freshData));
        }
      });
    }

    // Default Fallback Affiliate Products
    const defaultProducts = [
      {
        id: "p1",
        name: "Smart Watch",
        category: "tools",
        details: "Water resistant smart watch with sports tracking.",
        price: 2499,
        affiliateUrl: "https://example.com/affiliate-link-1",
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300"
      },
      {
        id: "p2",
        name: "Wireless Earbuds",
        category: "mobiles",
        details: "Active Noise cancellation sound.",
        price: 1850,
        affiliateUrl: "https://example.com/affiliate-link-2",
        image: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=300"
      }
    ];

    // RENDER AFFILIATE PRODUCTS
    function renderFilteredProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = "";

      const productList = window.currentProducts || defaultProducts;
      const searchVal = (document.getElementById('searchInput')?.value || '').toLowerCase();

      const filtered = productList.filter(p => {
        const pCategory = (p.category || '').toLowerCase().trim();
        const pName = (p.name || '').toLowerCase();
        
        const matchesCategory = selectedCategory === 'all' || 
          pCategory === selectedCategory.toLowerCase() || 
          pName.includes(selectedCategory.toLowerCase());

        const matchesSearch = !searchVal || pName.includes(searchVal);

        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="width:100%; font-size:10px; color:var(--text-muted); text-align:center; padding:10px;">No deals found.</div>`;
        return;
      }

      filtered.forEach(p => {
        const link = p.affiliateUrl || p.link || '#';
        grid.innerHTML += `
          <div class="product-card" onclick="openAffiliateLink('${link}')">
            <img src="${p.image || 'https://via.placeholder.com/150'}" class="product-img" alt="${p.name}" />
            <div class="product-title">${p.name}</div>
            <div class="product-desc">${p.details || ''}</div>
            <div class="product-bottom">
              <div class="product-price">Rs. ${p.price}</div>
              <button class="affiliate-btn" onclick="event.stopPropagation(); openAffiliateLink('${link}')">
                Buy <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:8px;"></i>
              </button>
            </div>
          </div>
        `;
      });
    }

    // CATEGORY FILTER
    window.filterByCategory = function(categoryName, element) {
      selectedCategory = categoryName;

      const catBtns = document.querySelectorAll('.cat-btn');
      catBtns.forEach(btn => btn.classList.remove('active'));
      if(element) element.classList.add('active');

      renderFilteredProducts();
    };

    window.filterProducts = function() {
      renderFilteredProducts();
    };

    // REALTIME FIREBASE PRODUCTS FETCH
    onValue(ref(db, 'products'), (snapshot) => {
      let productList = [];
      if (snapshot.exists()) {
        const data = snapshot.val();
        Object.keys(data).forEach(key => {
          productList.push({ id: key, ...data[key] });
        });
      } else {
        productList = defaultProducts;
      }

      window.currentProducts = productList;
      renderFilteredProducts();
    });
  </script>
</body>
</html>
