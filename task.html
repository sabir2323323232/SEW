
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SEW - Tasks Hub</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #eff6ff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent-green: #059669;
      --accent-purple: #7c3aed;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 14px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAVBAR */
    .navbar {
      background: #ffffff;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .back-btn {
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid #dbeafe;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
    }

    .profile-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-soft);
      padding: 4px 8px;
      border-radius: 20px;
      border: 1px solid #dbeafe;
    }

    .avatar {
      width: 22px;
      height: 22px;
      background: var(--primary);
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 11px;
    }

    .user-name-short {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      max-width: 80px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* MAIN CONTAINER */
    .container {
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* BALANCE CARD */
    .balance-card {
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      border-radius: 14px;
      padding: 14px 16px;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-md);
    }

    .balance-info p {
      font-size: 10px;
      opacity: 0.9;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .balance-amount {
      font-size: 22px;
      font-weight: 800;
      margin-top: 2px;
    }

    .balance-badge {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(4px);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* SECTION TITLE */
    .section-header {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    /* TASK CARDS GRID */
    .tasks-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .task-card:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .task-card:active {
      transform: scale(0.98);
    }

    .task-icon-box {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .icon-video {
      background: #fef2f2;
      color: #ef4444;
      border: 1px solid #fee2e2;
    }

    .icon-app {
      background: #f0fdf4;
      color: var(--accent-green);
      border: 1px solid #dcfce7;
    }

    .task-details {
      flex: 1;
    }

    .task-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .task-desc {
      font-size: 10.5px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .action-arrow {
      color: var(--text-muted);
      font-size: 12px;
      transition: transform 0.2s;
    }

    .task-card:hover .action-arrow {
      transform: translateX(3px);
      color: var(--primary);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <a href="dashboard.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i> Dashboard
    </a>

    <div class="brand-title">Available Tasks</div>

    <div class="profile-pill">
      <div class="avatar" id="navAvatar">U</div>
      <span class="user-name-short" id="navUserName">User</span>
    </div>
  </header>

  <div class="container">

    <!-- LIVE BALANCE CARD -->
    <div class="balance-card">
      <div class="balance-info">
        <p>Current Balance</p>
        <div class="balance-amount" id="userBalance">Rs. 0.00</div>
      </div>
      <div class="balance-badge">
        <span class="live-dot"></span> Live Sync
      </div>
    </div>

    <!-- TASKS LIST -->
    <div class="section-header">Select Task Category</div>

    <div class="tasks-grid">
      <!-- VIDEO TASK BUTTON -->
      <div class="task-card" onclick="location.href='video-task.html'">
        <div class="task-icon-box icon-video">
          <i class="fa-solid fa-circle-play"></i>
        </div>
        <div class="task-details">
          <div class="task-title">
            <span>Video Tasks</span>
            <i class="fa-solid fa-chevron-right action-arrow"></i>
          </div>
          <div class="task-desc">Short videos dekh kar daily balance earn karein.</div>
        </div>
      </div>

      <!-- APP DOWNLOAD TASK BUTTON -->
      <div class="task-card" onclick="location.href='app-task.html'">
        <div class="task-icon-box icon-app">
          <i class="fa-solid fa-cloud-arrow-down"></i>
        </div>
        <div class="task-details">
          <div class="task-title">
            <span>Download App Tasks</span>
            <i class="fa-solid fa-chevron-right action-arrow"></i>
          </div>
          <div class="task-desc">Apps download aur test karke rewards hasil karein.</div>
        </div>
      </div>
    </div>

  </div>

  <!-- FIREBASE REALTIME CONNECTION SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAsnATksiqZzMHOPO64i_bKqLJW6yjq9lw",
      authDomain: "newweb-d50af.firebaseapp.com",
      databaseURL: "https://newweb-d50af-default-rtdb.firebaseio.com",
      projectId: "newweb-d50af",
      storageBucket: "newweb-d50af.firebasestorage.app",
      messagingSenderId: "358603295768",
      appId: "1:358603295768:web:82a9666514a7cb468c476d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 1. SESSION VERIFICATION
    const rawSession = localStorage.getItem('sew_session');
    if (!rawSession) {
      window.location.replace("index.html");
    }

    const userData = JSON.parse(rawSession || '{}');

    function renderUserUI(data) {
      if (!data) return;
      const displayTitle = data.fullName || data.username || "User";
      document.getElementById('navUserName').innerText = displayTitle;
      document.getElementById('navAvatar').innerText = displayTitle.charAt(0).toUpperCase();
      document.getElementById('userBalance').innerText = "Rs. " + (parseFloat(data.balance) || 0).toFixed(2);
    }

    renderUserUI(userData);

    // 2. REAL-TIME FIREBASE BALANCE LISTENER
    if (userData.username) {
      onValue(ref(db, 'users/' + userData.username), (snapshot) => {
        if (snapshot.exists()) {
          const freshData = snapshot.val();
          renderUserUI(freshData);
          localStorage.setItem('sew_session', JSON.stringify(freshData));
        }
      });
    }
  </script>
</body>
</html>
